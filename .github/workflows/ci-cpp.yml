name: CI C++

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PIXI_COLOR: always

jobs:
  build_and_test:
    name: C++ project (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.6
      # No CUDA on the runner: CPU build with warnings as errors (the ci preset in CMakePresets.json)
      - run: pixi run cmake --preset ci
      - run: pixi run cmake --build --preset ci -j 4
      # The C++ tests; cli (the pytest tests) runs in ci-python.yml
      - run: pixi run ctest --preset ci -E '^cli$' -j 4
