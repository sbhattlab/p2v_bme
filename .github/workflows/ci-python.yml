name: CI Python

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PIXI_COLOR: always

jobs:
  build_and_test:
    name: Python project (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.6
      - run: pixi run ty check
      # Builds p2v-bme (CPU only: no CUDA on the runner), then runs the command-line tests
      - run: pixi run test-python -m "not gpu"
