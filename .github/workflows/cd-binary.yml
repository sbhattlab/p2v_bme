name: CD binary

# The prebuilt Linux binary (README.md, "Prebuilt binary"): built in a CUDA image with an old glibc, tested on a runner
# without CUDA, uploaded as a workflow artifact, and attached to each published release. The package's tests run in
# ci-cpp.yml and ci-python.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

env:
  PIXI_COLOR: always

jobs:
  build:
    name: Build (Linux x86-64)
    runs-on: ubuntu-latest
    # CUDA 12.8 (the first with compute capability 10.0 and 12.0) on Rocky Linux 8: glibc 2.28
    container: nvidia/cuda:12.8.1-devel-rockylinux8
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - name: Install git and GCC 13
        run: dnf install -y -q git gcc-toolset-13-gcc-c++
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.6
      # The release preset (CMakePresets.json): GPU code for compute capability 7.5 to 12.0 and PTX, runtimes linked in
      - name: Build
        run: |
          source /opt/rh/gcc-toolset-13/enable
          pixi run cmake --preset release
          pixi run cmake --build --preset release -j 4
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^project(vecme VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$EVENT" = release ] && [ "$TAG" != "v$version" ]; then
            echo "the release tag $TAG is not v$version (CMakeLists.txt)"
            exit 1
          fi
          # No version in the name, so that releases/latest/download/<name>.tar.gz always gets the latest (README.md)
          name=p2v-bme-linux-x86_64
          mkdir "$name"
          cp build-release/p2v-bme LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: p2v-bme-linux-x86_64
          path: ${{ steps.package.outputs.name }}.tar.gz*

  test:
    name: Test the binary (no CUDA)
    needs: build
    # An older system than the build's compiler, without CUDA or a GPU
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: p2v-bme-linux-x86_64
      - name: Unpack
        run: |
          sha256sum -c ${{ needs.build.outputs.name }}.tar.gz.sha256
          tar xzf ${{ needs.build.outputs.name }}.tar.gz
          ldd ${{ needs.build.outputs.name }}/p2v-bme
          ${{ needs.build.outputs.name }}/p2v-bme --version
      - uses: prefix-dev/setup-pixi@v0.9.6
      # The examples on the CPU, with the binary as shipped
      - name: Test
        run: pixi run python -m pytest tests/python/test_examples.py -m "not gpu" -v
        env:
          VECME_BIN: ${{ needs.build.outputs.name }}/p2v-bme

  release:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: p2v-bme-linux-x86_64
      - name: Upload
        run: gh release upload "$TAG" --repo "$REPO" --clobber "$NAME.tar.gz" "$NAME.tar.gz.sha256"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          NAME: ${{ needs.build.outputs.name }}
