[workspace]
authors = ["Neclow <32112754+Neclow@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
name = "phylo2vec_bme"
platforms = ["linux-64"]
version = "0.1.0"

# ---- package environment (default) ------------------------------------------------------------------
# What building and testing p2v-bme needs, plus pre-commit (.pre-commit-config.yaml). C/C++ compilers, CMake and
# nvcc come from the system (cc, g++, cmake, nvcc on PATH).
[dependencies]
cxxopts = "3.2.*"
gtest = "1.18.*"
benchmark = ">=1.10.0,<2"
pre-commit = ">=4.7.0,<5"
python = ">=3.12.16,<3.16"
pytest = ">=9.2.0,<10"
ty = ">=0.0.108,<0.0.109"

[tasks]
# CMake presets (CMakePresets.json); everything is built into build/
build = "cmake --preset default && cmake --build --preset default -j 8"
test = { cmd = "ctest --preset default", depends-on = ["build"] }
# CPU tests under AddressSanitizer and UBSan, in build-asan/
test-asan = "cmake --preset asan && cmake --build --preset asan -j 8 && ctest --preset asan"
# Only the Python tests (tests/python, with pytest); extra arguments go to pytest, e.g. -m "not gpu"
test-python = { cmd = "python -m pytest tests/python", depends-on = ["build"] }
# A simulated alignment and its true tree (tests/make_test_fasta.cpp), e.g. the examples (examples/README.md):
#   pixi run make_test_fasta examples/jc69_1k 1000 1500 1
make_test_fasta = { cmd = "build/make_test_fasta", depends-on = ["build"] }

# ---- paper environment ---------------------------------------------------------------------------------
# Python for the paper's scripts (paper/) and the plots (plots/), plus the comparison programs they run.
# Scripts run as modules: pixi run -e paper python -m paper.run_benchmarks --help
[feature.paper.dependencies]
python = "3.12.*"
numpy = ">=2.5.4,<3"
matplotlib = ">=3.11.2,<4"
pandas = ">=3.1,<4"
pytest = ">=9.2.0,<10"
fastme = "2.1.6.3.*"
veryfasttree = "4.0.*"
fasttree = "2.2.*"

[feature.paper.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

[feature.paper.tasks]
# Every paper script and plot on tiny simulated inputs, on the CPU (CI runs it)
check-paper = { cmd = "python -m paper.check_entry_points", depends-on = ["build"] }
# The paper's scripts (paper/), in the order they run; extra arguments go to the script, e.g.
#   pixi run -e paper download_data --sources rnasim
# Each one's --help lists its options. The ones that run p2v-bme or the paper's tools need `pixi run build` first.
download_data = "python -m paper.download_data"
simulate_data = "python -m paper.simulate_data"
run_benchmarks = "python -m paper.run_benchmarks"
run_baselines = "python -m paper.run_baselines"
run_fastme = "python -m paper.run_fastme"
run_calibration = "python -m paper.run_calibration"
run_gtr_fit_recovery = "python -m paper.run_gtr_fit_recovery"
run_silva = "python -m paper.run_silva"
run_viridian = "python -m paper.run_viridian"
make_tables = "python -m paper.make_tables"

[environments]
paper = ["paper"]
